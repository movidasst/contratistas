name: Verificacion de aplicacion SST
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar sintaxis y controles
        run: node tests/assurance.test.js
